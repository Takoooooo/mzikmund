name: Install Dependencies
description: ""

inputs:
  target-platform:
    description: 'The platform to install dependencies for. #See available values at https://platform.uno/docs/articles/external/uno.check/doc/using-uno-check.html'
    required: false
    default: 'all'
  dotnet-version:
    description: 'Installs and sets the .NET SDK Version'
    required: false
    default: '9.0.x'
  sdkVersion:
    description: 'The version of the Windows Sdk'
    required: false
    default: '22621'

runs:
  using: "composite"
  steps:
    # Install .NET
    - name: Setup .NET ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '${{ inputs.dotnet-version }}'

    - name: Publish uno.check nupkg
      uses: actions/upload-artifact@v3
      with:
        name: uno-check-nupkg
        path: .\.github\Uno.Check.1.0.0.nupkg


    # Install Windows SDK
    - name: Install Windows SDK ${{ inputs.sdkVersion }}
      shell: pwsh
      if: ${{ runner.os == 'Windows' }}
      run: .\.github\Install-WindowsSdkISO.ps1 ${{ inputs.sdkVersion }}

    # Run Uno.Check
    # ─── Run Uno.Check (from *your* nupkg) ──────────────────────────────────────
    - name: Install ${{ inputs.target-platform }} Workloads (local uno.check)
      shell: pwsh
      run: |
        # 1️⃣  Remove any marketplace version that might already be on the agent
        dotnet tool uninstall -g uno.check 2>$null || echo "uno.check not previously installed"

        # 2️⃣  Pull the nupkg produced by an earlier job
        echo "Downloading uno-check nupkg artifact…"
        # actions/download-artifact writes to the current working dir by default
        # We invoke it with the GHA-provided helper so we stay in the same step
        gh-actions-download-artifact `
            -name "uno-check-nupkg" `
            -path "./local_nupkgs"

        # 3️⃣  Install the tool from the local folder (no NuGet.org hit)
        $pkgPath = Get-ChildItem "./local_nupkgs" -Filter "uno.check.*.nupkg" | Select-Object -First 1
        if (-not $pkgPath) { throw "uno.check nupkg not found!" }

        dotnet tool install -g uno.check `
            --add-source $pkgPath.DirectoryName `
            --version 1.0.0 `
            --ignore-failed-sources      # avoids trying NuGet.org if we’re offline

        dotnet tool list -g

        # 4️⃣  Run uno-check exactly like before
        ("${{ inputs.target-platform }} ".Split(' ') | ForEach-Object {
          $target = $_.Replace("_win", "").Replace("_macos", "")
          if (![string]::IsNullOrEmpty($target)) {
            echo "target: $target"
            uno-check -v --ci --non-interactive --fix --target $target --skip vswin --skip vsmac --skip xcode --skip vswinworkloads --skip androidemulator --skip dotnetnewunotemplates
            echo "uno-check finished for target: $target "
          }
        })
